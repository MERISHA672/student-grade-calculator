<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 400px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #172554;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f8fafc;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Student Grade Calculator</h1>

    <input type="number" id="math" placeholder="Math mark">
    <input type="number" id="science" placeholder="Science mark">
    <input type="number" id="english" placeholder="English mark">

    <button onclick="calculateGrade()">Calculate Grade</button>

    <div id="result"></div>
</div>

<script>
function calculateGrade() {

    let math = Number(document.getElementById("math").value);
    let science = Number(document.getElementById("science").value);
    let english = Number(document.getElementById("english").value);

    let total = math + science + english;
    let average = total / 3;

    let grade;

    if (average >= 80) {
        grade = "A";
    } else if (average >= 70) {
        grade = "B";
    } else if (average >= 60) {
        grade = "C";
    } else if (average >= 50) {
        grade = "D";
    } else {
        grade = "F";
    }

    let status = average >= 50 ? "PASS" : "FAIL";

    document.getElementById("result").innerHTML = `
        <h3>Results</h3>
        <p><strong>Total:</strong> ${total}</p>
        <p><strong>Average:</strong> ${average.toFixed(2)}</p>
        <p><strong>Grade:</strong> ${grade}</p>
        <p><strong>Status:</strong> ${status}</p>
    `;
}
</script>

</body>
</html>
